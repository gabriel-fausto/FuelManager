<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - FuelManager Pro</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="card auth-card">
      <h1 class="text-center mb-20">FuelManager Pro</h1>
      <h2 class="text-center mb-20">Cadastro</h2>
      
      <div id="mensagem"></div>
      
      <form id="cadastroForm">
        <div class="form-group">
          <label for="nome">Nome completo:</label>
          <input type="text" id="nome" name="nome" required minlength="3">
        </div>
        
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required>
        </div>
        
        <div class="form-group">
          <label for="cep">CEP:</label>
          <input type="text" id="cep" name="cep" required maxlength="8" placeholder="00000000">
        </div>
        
        <div class="form-group">
          <label for="senha">Senha (mínimo 6 caracteres):</label>
          <input type="password" id="senha" name="senha" required minlength="6">
        </div>
        
        <div class="form-group">
          <label for="confirmarSenha">Confirmar senha:</label>
          <input type="password" id="confirmarSenha" name="confirmarSenha" required minlength="6">
        </div>
        
        <div class="form-group">
          <label for="dicaSenha">Dica de senha (mínimo 10 caracteres):</label>
          <input type="text" id="dicaSenha" name="dicaSenha" required minlength="10">
        </div>
        
        <button type="submit" class="btn btn-primary btn-block">Cadastrar</button>
      </form>
      
      <div class="text-center mt-20">
        <span>Já tem conta? </span>
        <a href="index.html" class="link">Faça login</a>
      </div>
    </div>
  </div>
  
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('cadastroForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const nome = document.getElementById('nome').value;
      const email = document.getElementById('email').value;
      const cep = document.getElementById('cep').value.replace(/\D/g, '');
      const senha = document.getElementById('senha').value;
      const confirmarSenha = document.getElementById('confirmarSenha').value;
      const dicaSenha = document.getElementById('dicaSenha').value;
      
      // Frontend validations
      if (nome.length < 3) {
        mostrarMensagem('O nome deve ter no mínimo 3 caracteres', 'error');
        return;
      }
      
      if (senha.length < 6) {
        mostrarMensagem('A senha deve ter no mínimo 6 caracteres', 'error');
        return;
      }
      
      if (senha !== confirmarSenha) {
        mostrarMensagem('As senhas não conferem', 'error');
        return;
      }
      
      if (dicaSenha.length < 10) {
        mostrarMensagem('A dica de senha deve ter no mínimo 10 caracteres', 'error');
        return;
      }
      
      if (cep.length !== 8) {
        mostrarMensagem('O CEP deve ter 8 dígitos', 'error');
        return;
      }
      
      try {
        const response = await fetch(`${API_BASE_URL}/usuario/cadastrar`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome, email, senha, dicaSenha, cep })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          mostrarMensagem(data.mensagem, 'success');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 2000);
        } else {
          mostrarMensagem(data.mensagem, 'error');
        }
      } catch (error) {
        mostrarMensagem('Erro ao conectar com o servidor', 'error');
      }
    });
  </script>
</body>
</html>
