<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clima - FuelManager Pro</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <h1>FuelManager Pro</h1>
      <nav>
        <ul>
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="abastecimento.html">Registrar</a></li>
          <li><a href="meus-abastecimentos.html">Meus Abastecimentos</a></li>
          <li><a href="estatisticas.html">Estatísticas</a></li>
          <li><a href="clima.html">Clima</a></li>
          <li><a href="#" onclick="sair(); return false;">Sair</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="container">
    <!-- Seção 1: Clima da Minha Cidade -->
    <div class="card">
      <h2>☁️ Clima da Minha Cidade</h2>
      <p>Cidade: <strong id="minhaCidade">-</strong></p>
      <button class="btn btn-primary" onclick="carregarClimaMinhaCidade()">Carregar Clima</button>
      <div id="climaMinhaCidade" style="margin-top: 20px;"></div>
    </div>

    <!-- Seção 2: Buscar Outra Cidade -->
    <div class="card">
      <h2>🔍 Buscar Clima de Outra Cidade</h2>
      <div style="display: flex; gap: 10px; margin-bottom: 15px;">
        <input type="text" id="inputCidade" placeholder="Digite o nome da cidade" style="flex: 1; padding: 12px; border: 2px solid #e0e0e0; border-radius: 5px;">
        <button class="btn btn-primary" onclick="buscarClimaCidade()">Buscar</button>
      </div>
      <div id="climaBuscado"></div>
    </div>

    <!-- Seção 3: Calculadora de Viagem -->
    <div class="card">
      <h2>🚗 Calculadora de Viagem</h2>
      <div class="form-group">
        <label for="distanciaViagem">Distância da viagem (Km):</label>
        <input type="number" id="distanciaViagem" step="0.1" min="0">
      </div>
      <div class="form-group">
        <label for="consumoMedioViagem">Consumo médio do veículo (Km/L):</label>
        <input type="number" id="consumoMedioViagem" step="0.01" min="0">
      </div>
      <div class="form-group">
        <label for="precoCombustivelViagem">Preço do combustível (R$/L):</label>
        <input type="number" id="precoCombustivelViagem" step="0.01" min="0">
      </div>
      <button class="btn btn-success" onclick="calcularViagem()">Calcular</button>
      
      <div id="resultadoViagem" style="display: none; margin-top: 20px; background: #f8f9fa; padding: 20px; border-radius: 8px;">
        <h3 style="color: #667eea; margin-bottom: 15px;">Resultado da Viagem</h3>
        <div style="display: grid; gap: 10px;">
          <div style="display: flex; justify-content: space-between;">
            <span><strong>Litros necessários:</strong></span>
            <span id="litrosNecessarios">-</span>
          </div>
          <div style="display: flex; justify-content: space-between;">
            <span><strong>Custo total:</strong></span>
            <span id="custoTotal" style="font-size: 24px; color: #667eea; font-weight: bold;">-</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    // Verify authentication
    const usuario = verificarAutenticacao();
    if (!usuario) {
      window.location.href = 'index.html';
    }

    // Display user city
    document.getElementById('minhaCidade').textContent = usuario.endereco.city;

    // Pre-fill average consumption
    const abastecimentos = obterAbastecimentos(usuario.id);
    const abastecimentosTanqueCheio = abastecimentos.filter(a => a.tanqueCheio && a.consumoMedio);
    if (abastecimentosTanqueCheio.length > 0) {
      const consumoMedio = abastecimentosTanqueCheio.reduce((sum, a) => 
        sum + parseFloat(a.consumoMedio), 0) / abastecimentosTanqueCheio.length;
      document.getElementById('consumoMedioViagem').value = consumoMedio.toFixed(2);
    }

    async function carregarClimaMinhaCidade() {
      const cidade = usuario.endereco.city;
      await buscarClima(cidade, 'climaMinhaCidade');
    }

    async function buscarClimaCidade() {
      const cidade = document.getElementById('inputCidade').value.trim();
      if (!cidade) {
        mostrarMensagem('Digite o nome de uma cidade', 'error');
        return;
      }
      await buscarClima(cidade, 'climaBuscado');
    }

    async function buscarClima(nomeCidade, containerId) {
      const container = document.getElementById(containerId);
      container.innerHTML = '<div class="loading">Buscando previsão do tempo</div>';

      try {
        const response = await fetch(`${API_BASE_URL}/clima/${encodeURIComponent(nomeCidade)}`);
        const data = await response.json();

        if (response.ok) {
          container.innerHTML = `
            <div style="background: #f8f9fa; padding: 20px; border-radius: 8px;">
              <h3 style="color: #667eea; margin-bottom: 15px;">${data.cidade} - ${data.estado}</h3>
              <div class="clima-grid">
                ${data.clima.map(dia => `
                  <div class="previsao-dia">
                    <h4>${formatarData(dia.data)}</h4>
                    <p><strong>Condição:</strong> ${dia.condicao}</p>
                    <p><strong>Mín:</strong> ${dia.min}°C | <strong>Máx:</strong> ${dia.max}°C</p>
                    ${dia.condicao_desc ? `<p style="margin-top: 10px; color: #666;">${dia.condicao_desc}</p>` : ''}
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        } else {
          container.innerHTML = `<p style="color: #dc3545;">${data.mensagem || 'Erro ao buscar previsão'}</p>`;
        }
      } catch (error) {
        container.innerHTML = '<p style="color: #dc3545;">Erro ao conectar com o servidor</p>';
      }
    }

    function calcularViagem() {
      const distancia = parseFloat(document.getElementById('distanciaViagem').value);
      const consumoMedio = parseFloat(document.getElementById('consumoMedioViagem').value);
      const precoCombustivel = parseFloat(document.getElementById('precoCombustivelViagem').value);

      if (!distancia || !consumoMedio || !precoCombustivel) {
        mostrarMensagem('Preencha todos os campos', 'error');
        return;
      }

      if (distancia <= 0 || consumoMedio <= 0 || precoCombustivel <= 0) {
        mostrarMensagem('Os valores devem ser maiores que zero', 'error');
        return;
      }

      const litrosNecessarios = distancia / consumoMedio;
      const custoTotal = litrosNecessarios * precoCombustivel;

      document.getElementById('litrosNecessarios').textContent = litrosNecessarios.toFixed(2) + ' L';
      document.getElementById('custoTotal').textContent = formatarMoeda(custoTotal);
      document.getElementById('resultadoViagem').style.display = 'block';
    }
  </script>
</body>
</html>
